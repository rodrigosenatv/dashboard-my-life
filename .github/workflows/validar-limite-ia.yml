name: Validar limite da IA compartilhada

on:
  push:
    branches:
      - security/limitar-uso-ia-compartilhada
  pull_request:
    paths:
      - "src/app/api/ia/route.ts"
      - "src/lib/ia/limite-compartilhado.ts"
      - "src/lib/ia/politica-limite.ts"
      - "supabase/migrations/*limite_ia_compartilhada.sql"
      - "tests/limite-ia.test.cjs"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seguranca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d seguranca -f tests/seguranca-banco.sql
      - run: npm test
      - run: npx next typegen
      - run: npm run check
      - run: npm run build
