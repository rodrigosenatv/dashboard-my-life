<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#191919" />
    <title>Sem conexão | My Life</title>
    <style>
      /* Página servida pelo service worker sem rede: tudo fica aqui dentro, sem arquivos externos além do ícone */
      :root {
        color-scheme: dark light;
        --bg: #191919;
        --ink: #ececec;
        --ink-2: #a8a8a8;
        --pen: #4aa3c2;
        --pen-ink: #0f1d23;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f5f7;
          --ink: #1a1f36;
          --ink-2: #565c75;
          --pen: #2340c9;
          --pen-ink: #ffffff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.5rem;
        line-height: 1.25;
        letter-spacing: -0.015em;
      }
      p {
        margin: 0;
        color: var(--ink-2);
      }
      button {
        margin-top: 24px;
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: var(--pen);
        color: var(--pen-ink);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--pen);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>O My Life precisa da internet para mostrar e salvar seus dados. Assim que a conexão voltar, a página abre sozinha.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
    <script>
      window.addEventListener("online", function () {
        location.reload()
      })
      // Nem todo aparelho avisa quando a rede volta: confere de tempos em tempos
      setInterval(function () {
        fetch("/manifest.webmanifest", { method: "HEAD", cache: "no-store" }).then(function (r) {
          if (r.ok) location.reload()
        }, function () {})
      }, 5000)
    </script>
  </body>
</html>
